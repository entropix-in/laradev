name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run tests
        run: go test ./...

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Build release binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-X github.com/entropix-in/laradev/internal/version.Value=${VERSION}" -o dist/laradev ./cmd/laradev
          tar --create --gzip --file dist/laradev-linux-amd64.tar.gz --directory dist laradev
          (cd dist && sha256sum laradev-linux-amd64.tar.gz > laradev-linux-amd64.tar.gz.sha256)

      - name: Create GitHub release from pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/laradev-linux-amd64.tar.gz dist/laradev-linux-amd64.tar.gz.sha256 --verify-tag --generate-notes --title "$RELEASE_TAG"

      - name: Upload assets to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/laradev-linux-amd64.tar.gz dist/laradev-linux-amd64.tar.gz.sha256 --clobber
